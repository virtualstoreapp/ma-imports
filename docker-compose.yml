services:
  app-server:
    extends:
      file: docker-compose.common.yaml
      service: node-base
    command: npm run dev
    tty: true
    stdin_open: true
    ports:
      - 8000:8000

  # The suite runs against jsdom with fetch mocked, so it needs no web server.
  # Depending on app-server would leave a container holding port 8000 behind,
  # because `run --rm` only removes the service it was asked to run.
  test-app:
    extends:
      file: docker-compose.common.yaml
      service: node-base
    command: ["npm", "test"]
    tty: true
    stdin_open: true

  update-tests-snapshots:
    extends:
      file: docker-compose.common.yaml
      service: node-base
    command: ["npm", "test", "--", "-u"]

  # Runs the production build on Linux/musl, the same platform as CI, so a
  # native-dependency or catalog problem surfaces before pushing.
  build-app:
    extends:
      file: docker-compose.common.yaml
      service: node-base
    command: ["npm", "run", "build"]

  # Serves dist/ exactly as GitHub Pages will. Run build-app first.
  preview:
    extends:
      file: docker-compose.common.yaml
      service: node-base
    command: ["node", "serve.js", "dist"]
    ports:
      - 8000:8000
