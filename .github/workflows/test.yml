name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Snapshot Tests
        run: npm test

      # Fails the PR when a product references an image that is not in the repo,
      # which is the usual defect in catalog update PRs.
      - name: Verify site builds
        run: npm run build
