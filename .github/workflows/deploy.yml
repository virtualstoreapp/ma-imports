name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish through the Pages deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist/images holds the derivatives; .image-cache records the fingerprint
      # each was rendered from. Both are needed: without the fingerprints every
      # derivative re-renders, and without the derivatives the fingerprints
      # describe files that are not there.
      #
      # Freshness is decided by content hash, not mtime, which is what makes
      # restore-keys useful here. Under the old mtime comparison a restored
      # cache always tested as stale, because actions/checkout writes sources
      # with the checkout time while actions/cache restores older mtimes — so
      # the whole tree re-encoded on every run.
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: |
            dist/images
            .image-cache
          key: images-${{ hashFiles('images/**') }}
          restore-keys: |
            images-

      - name: Build site
        run: npm run build

      # Advisory only: annotates the run when a storage-growth threshold is
      # crossed (see ADR-001). Never fails the build.
      - name: Report growth thresholds
        run: node tools/report-growth.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
